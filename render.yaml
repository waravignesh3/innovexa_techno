services:
  - type: web
    name: innovex-techno-frontend
    runtime: node
    rootDir: Frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production

  - type: web
    name: innovex-techno-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: GITHUB_ACCESS_TOKEN
        sync: false
      - key: PORT
        value: 3000
